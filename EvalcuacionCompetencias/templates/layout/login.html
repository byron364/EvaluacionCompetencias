{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Evaluación de Competencias</title>
<!-- FAVICON -->
<link rel="icon" href="{% static 'img/escudo.png' %}" type="image/png">
<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- FontAwesome -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<!-- CSS -->
<link rel="stylesheet" href="{% static 'css/login.css' %}">

</head>

<body>

<div class="login-card">

    <!-- LOGO -->
    <img src="{% static 'img/EJC2026bl.png' %}" class="logo">

    <!-- TITULO -->
    <h4 class="title">Sistema de Evaluación</h4>
    <p class="subtitle">Acceso seguro - Ejército Nacional</p>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-danger py-2" role="alert">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <!-- FORMULARIO -->
<form method="POST" id="loginForm">
    {% csrf_token %}

    <!-- EMAIL -->
    <div class="input-group">
        <span class="input-group-text"><i class="fa fa-user"></i></span>
        <input id="email" type="email" name="email" class="form-control" placeholder="Correo institucional" required>
    </div>
    <div id="emailError" class="text-danger small mt-1 mb-2"></div>

    <!-- PASSWORD -->
    <div class="input-group">
        <span class="input-group-text"><i class="fa fa-lock"></i></span>
        <input type="password" name="password" class="form-control" placeholder="Contraseña" required>
    </div>

    <button type="submit" class="btn btn-login w-100">
        Ingresar
    </button>

</form>

</div>

<!-- VALIDACIÓN JS -->
<script>
const form = document.getElementById("loginForm");
const emailInput = document.getElementById("email");
const emailError = document.getElementById("emailError");

form.addEventListener("submit", function(e) {
    const email = emailInput.value.trim();

    if (!email.endsWith("@ejercito.mil.co")) {
        e.preventDefault();
        emailError.innerText = "Debe usar un correo institucional (@ejercito.mil.co)";
        emailInput.classList.add("is-invalid");
    } else {
        emailError.innerText = "";
        emailInput.classList.remove("is-invalid");
    }
});
</script>

</body>
</html>
