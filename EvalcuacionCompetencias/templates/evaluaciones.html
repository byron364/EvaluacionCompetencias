<div id="contenido-parcial">
    <div class="cursos">
        <h2 class="mb-4">📝 Evaluaciones</h2>

        <div class="row">
            {% for asignacion in asignaciones %}
            <div class="col-md-4 mb-3">
                <div class="card-curso azul">
                    <h5>{{ asignacion.evaluacion.titulo }}</h5>
                    <p>Compañía: {{ asignacion.evaluacion.compania.nombre }}</p>
                    <p>Fecha: {{ asignacion.evaluacion.fecha }}</p>
                    <div class="barra">
                        <div class="progreso" style="width: {% widthratio asignacion.puntaje_actual asignacion.evaluacion.puntaje_maximo 100 %}%;"></div>
                    </div>
                </div>
            </div>
            {% empty %}
            <div class="col-12">
                <div class="card-curso azul">
                    <h5>Sin evaluaciones disponibles</h5>
                    <p>Aún no hay evaluaciones asociadas a tu compañía.</p>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
