{% load static %}
<!DOCTYPE html>
<html>

<head>
    <title>Soldado</title>
    <!-- FAVICON -->
    <link rel="icon" href="{% static 'img/escudo.png' %}" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="{% static 'css/soldado.css' %}">
    <style>

    </style>

</head>

<body>

    <!-- FONDO DECORATIVO -->
    <div class="bg-pattern">
        <div class="pattern-overlay"></div>
    </div>

    <!-- CONTENEDOR PRINCIPAL -->
    <div class="background-container">

        <!-- IMAGEN CENTRAL CON SOMBRA -->
        <img src="{% static 'img/fondoInicio.png' %}" class="bg-img">

        <!-- CAPA -->
        <div class="overlay">

            <div class="container-fluid">
                <button id="menuToggle" class="menu-toggle"> <i class="fa fa-bars"></i> </button>
                <div class="row">
                    <div class="col-md-2 sidebar">
                        <div class="imgEscudo">
                            <a href="" data-url="/soldado-dashboard/"></a>
                            <img src="{% static 'img/EJC2026bl.png' %}" width="80">
                            <h5>Soldado</h5>
                        </div>
                        <p>Nombres del soldado</p>
                        <hr>
                        <ul class="nav flex-column sidebar-menu">
                            <li class="nav-item">
                                <a class="nav-link nav-link-spa active" data-url="/inicio/">
                                    Inicio
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link nav-link-spa" data-url="/cursos/">
                                    Mis Cursos
                                </a>
                            </li>

                            <li class="nav-item">
                                <a class="nav-link nav-link-spa" data-url="/evaluaciones/">
                                    Evaluaciones
                                </a>
                            </li>

                            <li class="nav-item">
                                <a class="nav-link nav-link-spa" data-url="/resultados/">
                                    Resultados
                                </a>
                            </li>

                            <li class="nav-item">
                                <a class="nav-link nav-link-spa" data-url="/retro/">
                                    Retroalimentación
                                </a>
                            </li>

                            <li class="nav-item">
                                <a class="nav-link text-white" href="/logout/">
                                    Cerrar sesión
                                </a>
                            </li>

                        </ul>

                    </div>

                    <!-- CONTENIDO -->
                    <div class="col-md-10 content" id="contenido-dinamico">

                        <img src="{% static 'img/escudo.png' %}" width="40%">

                        <div class="row mt-4">

                            <div class="col-md-3">
                                <button class="btn btn-success w-100 nav-btn" data-url="/cursos/">Ver
                                    Cursos</button>
                            </div>

                            <div class="col-md-3">
                                <button class="btn btn-primary w-100 nav-btn" data-url="/evaluaciones/">Presentar
                                    Evaluación</button>
                            </div>

                            <div class="col-md-3">
                                <button class="btn btn-warning w-100 nav-btn" data-url="/resultados/">Ver
                                    Resultados</button>
                            </div>

                            <div class="col-md-3">
                                <button class="btn btn-info w-100 nav-btn" data-url="/retro/">Evaluar
                                    Instructor</button>
                            </div>

                        </div>

                    </div>

                </div>
            </div>

        </div>

    </div>

</body>
<div id="loader" class="loader">
    <div class="spinner"></div>
    <p>Cargando módulo...</p>
</div>
<script>
    document.addEventListener("DOMContentLoaded", function () {

        const content = document.getElementById("contenido-dinamico");

        // 🔥 URL de inicio (dashboard)
        const HOME_URL = "/inicio/";

        function cargarVista(url, addToHistory = true) {

            const loader = document.getElementById("loader");

            loader.classList.add("active"); // 🔥 mostrar loader
            content.classList.add("fade-out");

            fetch(url)
                .then(response => response.text())
                .then(data => {

                    const parser = new DOMParser();
                    const doc = parser.parseFromString(data, "text/html");
                    const nuevoContenido = doc.getElementById("contenido-parcial");

                    setTimeout(() => {

                        if (nuevoContenido) {
                            content.innerHTML = nuevoContenido.outerHTML;
                        }

                        content.classList.remove("fade-out");
                        content.classList.add("fade-in");

                        loader.classList.remove("active"); // 🔥 ocultar loader

                    }, 300);

                    activarMenu(url);

                    if (addToHistory) {
                        history.pushState({ url: url }, "", url);
                    }

                })
                .catch(error => {
                    console.error("Error:", error);
                    loader.classList.remove("active");
                });
        }

        function activarMenu(url) {
            document.querySelectorAll(".nav-link-spa").forEach(link => {
                link.classList.remove("active");

                // 🔥 Detecta coincidencias parciales (mejor UX)
                if (url.startsWith(link.dataset.url)) {
                    link.classList.add("active");
                }
            });
        }

        // 🔘 BOTONES PRINCIPALES
        document.querySelectorAll(".nav-btn").forEach(btn => {
            btn.addEventListener("click", () => {
                let url = btn.dataset.url;
                cargarVista(url);
            });
        });

        // 📌 SIDEBAR
        document.querySelectorAll(".nav-link-spa").forEach(link => {
            link.addEventListener("click", function (e) {
                e.preventDefault();

                let url = this.dataset.url;

                activarMenu(url);
                cargarVista(url);
            });
        });

        // 🔙 BOTÓN ATRÁS / ADELANTE
        window.onpopstate = function (event) {
            let url = (event.state && event.state.url) ? event.state.url : location.pathname;
            cargarVista(url, false);
        };

        // 🚀 🔥 CARGA INICIAL (INICIO AUTOMÁTICO)
        if (location.pathname === "/" || location.pathname === "/soldado-dashboard/") {
            cargarVista(HOME_URL, false);
            activarMenu(HOME_URL);
        } else {
            // Si recarga en otra ruta
            cargarVista(location.pathname, false);
            activarMenu(location.pathname);
        }

    });
</script>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const menuToggle = document.getElementById("menuToggle");
        const sidebar = document.querySelector(".sidebar");

        menuToggle.addEventListener("click", function () {
            sidebar.classList.toggle("active");
        });
    });
</script>

</html>
