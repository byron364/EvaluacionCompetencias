{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Registro Institucional</title>

<link rel="icon" href="{% static 'img/escudo.png' %}">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<link rel="stylesheet" href="{% static 'css/login.css' %}">

</head>

<body>

<div class="login-card">

<img src="{% static 'img/escudo.png' %}" class="logo">

<h4 class="title">Registro de Usuario</h4>
<p class="text-center text-light mb-3">Sistema Institucional</p>

<form method="POST">
    {% csrf_token %}

    <!-- EMAIL -->
    <div class="input-group">
        <span class="input-group-text">
            <i class="fa fa-envelope"></i>
        </span>
        <input type="email" name="email" class="form-control"
               placeholder="usuario@ejercito.mil.co"
               pattern=".+@ejercito\.mil\.co"
               required>
    </div>

    <!-- PASSWORD -->
    <div class="input-group">
        <span class="input-group-text">
            <i class="fa fa-lock"></i>
        </span>
        <input type="password" name="password" class="form-control"
               placeholder="Contraseña" required>
    </div>

    <!-- ROL -->
    <div class="input-group">
        <span class="input-group-text">
            <i class="fa fa-user-shield"></i>
        </span>
        <select name="rol" class="form-control" required>
            <option value="">Seleccionar Rol</option>
            <option value="admin">Administrador</option>
            <option value="soldado">Soldado</option>
            <option value="instructor">Instructor</option>
        </select>
    </div>

    <!-- ERROR -->
    {% if error %}
        <div class="alert alert-danger mt-2">
            {{ error }}
        </div>
    {% endif %}

    <!-- BOTÓN -->
    <button class="btn btn-login w-100 mt-3">
        Registrarse
    </button>

</form>

<!-- LINK LOGIN -->
<div class="text-center mt-3">
    <span class="text-light">¿Ya tienes cuenta?</span>
    <a href="/" class="links">Iniciar sesión</a>
</div>

</div>

</body>
</html>
